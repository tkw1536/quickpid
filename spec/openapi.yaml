openapi: 3.0.0
info:
  title: QuickPID API
  description: |
    The QuickPID API is used for managing PIDs across namespaces, along with associated user accounts and rights management.

    The API is designed with a lot of verbosity in mind.
    In particular, all routes always require explicit parameters and in most cases are not defaulted automatically.
    Implementations should also validate objects passed, and return appropriate error codes when they do not match.

    The API roughly splits into a `Resolver API` and a `Management API`.
    The Resolver API is responsible for creating PIDs, whereas the management API is responsible for authentication and authorization. 
    Routes in the Resolver API are found in the `quickpid`, `namespaces`, `resources` and `mounts` tags below.
    Routes in the Management API are found in the `user`, `roles` and `credentials` tags below.

    In principle, the API can be run in one of two modes:

    - "Anonymous Mode": 
      The Management API is disabled, and no authentication for any API routes is required.
      This corresponds to just running the Resolver API in the architecture sketch above.
      
    - "Authenticated Mode": 
      Both Management and Resolver API are active.
      Users need to authenticate to access specific resolver routes.
  version: 3.0.0
  license:
    name: Creative Commons Attribution-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-sa/4.0/

tags:
  - name: quickpid
    description: Generic API server information. 
  - name: namespaces
    description: Operations related to namespaces.
  - name: resources
    description: Operations related to resources.
  - name: mounts
    description: Operations related to namespace mounts.
  - name: user
    description: Operations related to user accounts.
  - name: credentials
    description: Operations related to credentials 
  - name: roles
    description: Operations related to per-namespace roles.

servers:
  - url: /api/v2

security:
  - apiKey: []
  - basicAuth: []

paths:
  /resolver:
    get:
      summary: Return information regarding this API's limits and other configuration.
      operationId: getResolverInfo
      description: |
        This endpoint returns internal limits and configuration information.
        An implementation MAY refuse to expose any information, in which case a 404 response is expected.

        The endpoint (if enabled) crucially also returns if the server requires authentication or if it is in anonymous mode.
        In anonymous mode, no authentication is required for any of the other endpoints, and no authorization checks are performed.
        This is intended for use cases where the API runs behind a separate system which handles authentication and authorization on it's own.
      security: []
      tags:
        - quickpid
      responses:
        '200':
          description: Limits successfully retrieved.
          content:
            application/json:
              example: { maxBodyBytes: 1048576, defaultPageLimit: 50, maxPageLimit: 200, maxBatchItems: 100, authentication: true, maxAutocompleteUsers: 10 }
              schema:
                $ref: '#/components/schemas/InfoResponse'
        '404':
          description: Configuration is unavailable.
          content:
            application/json:
              example: { error: "infoUnavailable" }
              schema:
                $ref: '#/components/schemas/ErrorInfoUnavailable'
  /resolver/info:
    get:
      summary: Get meta information about the server.
      operationId: getServerInfo
      description: |
        Returns optional public meta information about this server, such as a human-readable
        comment, an about URL, and the software name and version.

        All fields are optional. When a field is present, it must be a non-empty string.
        This endpoint always returns 200.
      security: []
      tags:
        - quickpid
      responses:
        '200':
          description: Meta information successfully retrieved.
          content:
            application/json:
              example: { about: "https://quickpid.example/about", comment: "Public resolver for example data", software: "quickpid", version: "3.0.0" }
              schema:
                $ref: '#/components/schemas/MetaResponse'

  /resolver/namespaces:
    get:
      summary: List namespaces available on the resolver.
      operationId: listNamespaces
      description: |
        This endpoint returns a list of namespaces available on the server.
        They can be additionally filtered by several parameters.

        In anonymous mode, the initial list of namespaces includes all namespaces.
        
        In authenticated mode, only namespaces the current user has access to are returned.
        This is defined by having a role that is not `none` for a namespace.
        If the authenticated user is a superuser, all namespaces are returned.
      tags:
        - namespaces

      parameters:
        - name: tag
          description: |
            Filter namespaces by their tag.
            If omitted, namespaces of all tags are included.
            If provided with an empty value, the value is treated as the empty string.
          in: query
          required: false
          schema:
            type: string
          allowEmptyValue: true
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of namespaces to return.
            If omitted, a default value is applied.
            If the value exceeds the configured maximum, it is clamped to that maximum.
            A value of 0 returns an empty items array with a valid total.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: |
            Number of namespaces to skip before starting to collect the result set.
            If omitted, the value is treated as 0.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0

      responses:
        '200':
          description: |
            A paginated list of namespaces, sorted by their id in increasing order.
          content:
            application/json:
              example: { total: 1, offset: 0, items: [ { id: "ns_123", tag: "project-a", pidFormat: { pattern: "***-***", characters: "readable" }, dateCreated: "2026-07-30T10:00:00Z" } ] }
              schema:
                $ref: '#/components/schemas/PaginatedNamespacesResponse'
        '400':
          description: Invalid query parameter when listing namespaces (e.g. limit or offset).
          content:
            application/json:
              example: { error: "invalidQueryParameter" }
              schema:
                $ref: '#/components/schemas/ErrorInvalidQueryParameter'
        '401':
          description: Authentication is required or the credentials are incorrect when listing namespaces.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '500':
          description: Internal server error while listing namespaces.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

    post:
      summary: Creates a new namespace.
      operationId: createNamespace
      description: |
        This endpoint creates a new namespace with a server-assigned id.

        In anonymous mode, no authentication is required and no authorization checks are performed.

        In authenticated mode, any user can create a namespace.
        The authenticated user automatically receives the namespace 'manager' role for the new namespace.
      tags:
        - namespaces

      requestBody:
        required: true
        description: |
          A namespace to create.
          If the configured maximum request body size is exceeded, a 413 response is returned.
        content:
          application/json:
            example: { tag: "project-a", pidFormat: { pattern: "***-***", characters: "readable" } }
            schema:
              $ref: '#/components/schemas/NamespaceCreateRequest'

      responses:
        '201':
          description: Namespace created successfully.
          content:
            application/json:
              example: { id: "ns_123", tag: "project-a", pidFormat: { pattern: "***-***", characters: "readable" }, dateCreated: "2026-07-30T10:00:00Z" }
              schema:
                $ref: '#/components/schemas/Namespace'
        '400':
          description: Invalid request body when creating a namespace.
          content:
            application/json:
              example: { error: "bodyMissing" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBodyMissing'
                  - $ref: '#/components/schemas/ErrorBodyInvalidJSON'
        '401':
          description: Authentication is required or the credentials are incorrect when creating a namespace.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '413':
          description: Request body for creating a namespace exceeds the configured maximum size.
          content:
            application/json:
              example: { error: "bodySizeExceeded" }
              schema:
                $ref: '#/components/schemas/ErrorBodySizeExceeded'
        '500':
          description: Internal server error or ID generation failure while creating a namespace.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorDatabaseError'
                  - $ref: '#/components/schemas/ErrorBadIDGeneration'
        '503':
          description: Could not allocate a namespace id after repeated attempts.
          content:
            application/json:
              example: { error: "insufficientEntropy" }
              schema:
                $ref: '#/components/schemas/ErrorInsufficientEntropy'

  /resolver/resources/count:
    get:
      summary: Return the total number of resources (issued PIDs) stored across all namespaces.
      operationId: getResourceCount
      description: |
        This endpoint returns the total number of resources (issued PIDs) across all namespaces.
        This includes soft-deleted resources.
        This endpoint never requires authentication.
      security: []
      tags:
        - resources
      responses:
        '200':
          description: |
            Total count of resources in the resolver.
            Includes soft-deleted resources.
          content:
            application/json:
              example: { total: 42 }
              schema:
                $ref: '#/components/schemas/ResourceCountResponse'
        '500':
          description: Internal server error while counting resources.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

  /resolver/mounts:
    get:
      summary: List all namespace mounts.
      operationId: listMounts
      description: |
        Returns a paginated list of all mounts.
        Results are ordered ascending by namespace id, then by base URI.

        In anonymous mode, this route is accessible without authentication.
        In authenticated mode, only a superuser may list all mounts.
      tags:
        - mounts
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of mounts to return.
            If omitted, a default value is applied.
            If the value exceeds the configured maximum, it is clamped to that maximum.
            A value of 0 returns an empty items array with a valid total.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: |
            Number of mounts to skip before starting to collect the result set.
            If omitted, the value is treated as 0.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: |
            A paginated list of mounts, sorted by namespace id then base URI in increasing order.
          content:
            application/json:
              example: { total: 1, offset: 0, items: [ { baseUri: "https://example.org/base/", namespace: "ns_123" } ] }
              schema:
                $ref: '#/components/schemas/PaginatedMountsResponse'
        '400':
          description: Invalid query parameter when listing mounts (e.g. limit or offset).
          content:
            application/json:
              example: { error: "invalidQueryParameter" }
              schema:
                $ref: '#/components/schemas/ErrorInvalidQueryParameter'
        '401':
          description: Authentication is required or the credentials are incorrect when listing mounts.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The authenticated user is not allowed to list all mounts.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '500':
          description: Internal server error while listing mounts.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

  /resolver/mounts/{baseUri}:
    get:
      summary: Resolve a namespace mount by base URI.
      operationId: resolveMountByBaseUri
      description: |
        Returns the namespace id mapped from the given base URI.

        The `baseUri` path parameter must be a single path segment containing a percent-encoded absolute URI
        (for example, encode `https://example.com/prefix/` as `https%3A%2F%2Fexample.com%2Fprefix%2F`).

        This endpoint never requires authentication.
      security: []
      tags:
        - mounts
      parameters:
        - name: baseUri
          in: path
          required: true
          description: |
            Absolute base URI of the mount to resolve, percent-encoded as a single path segment.
          schema:
            $ref: '#/components/schemas/baseUri'
      responses:
        '200':
          description: Mount found.
          content:
            application/json:
              example: { baseUri: "https://example.org/base/", namespace: "ns_123" }
              schema:
                $ref: '#/components/schemas/Mount'
        '400':
          description: Invalid base URI when resolving a mount.
          content:
            application/json:
              example: { error: "invalidBaseUri" }
              schema:
                $ref: '#/components/schemas/ErrorInvalidBaseUri'
        '404':
          description: Mount does not exist when resolving by base URI.
          content:
            application/json:
              example: { error: "mountNotFound" }
              schema:
                $ref: '#/components/schemas/ErrorMountNotFound'
        '500':
          description: Internal server error while resolving a mount by base URI.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'
    put:
      summary: Create or replace a namespace mount.
      operationId: upsertNamespaceMount
      description: |
        Creates or replaces the unidirectional mapping from the given base URI to a namespace id.
        There may only be at most one mapping per base URI; multiple base URIs may map to the same namespace.

        The `baseUri` path parameter must be a single path segment containing a percent-encoded absolute URI
        (for example, encode `https://example.com/prefix/` as `https%3A%2F%2Fexample.com%2Fprefix%2F`).

        In anonymous mode, this route is accessible without authentication.
        In authenticated mode, only a superuser may update mounts.
      tags:
        - mounts
      parameters:
        - name: baseUri
          in: path
          required: true
          description: |
            Absolute base URI of the mount to create or replace, percent-encoded as a single path segment.
          schema:
            $ref: '#/components/schemas/baseUri'
      requestBody:
        required: true
        description: The id of the namespace to mount.
        content:
          application/json:
            example: { namespace: "ns_123" }
            schema:
              $ref: '#/components/schemas/MountUpsertRequest'
      responses:
        '200':
          description: Mount created or replaced.
          content:
            application/json:
              example: { baseUri: "https://example.org/base/", namespace: "ns_123" }
              schema:
                $ref: '#/components/schemas/Mount'
        '400':
          description: Invalid request body or base URI when creating or replacing a mount.
          content:
            application/json:
              example: { error: "bodyMissing" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBodyMissing'
                  - $ref: '#/components/schemas/ErrorBodyInvalidJSON'
                  - $ref: '#/components/schemas/ErrorInvalidBaseUri'
                  - $ref: '#/components/schemas/ErrorInvalidNamespaceID'
        '401':
          description: Authentication is required or the credentials are incorrect when creating or replacing a mount.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The authenticated user is not allowed to create or replace mounts.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Namespace does not exist when creating or replacing a mount.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                $ref: '#/components/schemas/ErrorNamespaceNotFound'
        '413':
          description: Request body for creating or replacing a mount exceeds the configured size limit.
          content:
            application/json:
              example: { error: "bodySizeExceeded" }
              schema:
                $ref: '#/components/schemas/ErrorBodySizeExceeded'
        '500':
          description: Internal server error while creating or replacing a mount.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'
    delete:
      summary: Delete a namespace mount.
      operationId: deleteNamespaceMount
      description: |
        Removes the mapping for the given base URI.

        The `baseUri` path parameter must be a single path segment containing a percent-encoded absolute URI
        (for example, encode `https://example.com/prefix/` as `https%3A%2F%2Fexample.com%2Fprefix%2F`).

        In anonymous mode, this route is accessible without authentication.
        In authenticated mode, only a superuser may delete a mount.
      tags:
        - mounts
      parameters:
        - name: baseUri
          in: path
          required: true
          description: |
            Absolute base URI of the mount to delete, percent-encoded as a single path segment.
          schema:
            $ref: '#/components/schemas/baseUri'
      responses:
        '204':
          description: Mount deleted.
        '400':
          description: Invalid base URI when deleting a mount.
          content:
            application/json:
              example: { error: "invalidBaseUri" }
              schema:
                $ref: '#/components/schemas/ErrorInvalidBaseUri'
        '401':
          description: Authentication is required or the credentials are incorrect when deleting a mount.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The authenticated user is not allowed to delete mounts.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Mount does not exist when deleting by base URI.
          content:
            application/json:
              example: { error: "mountNotFound" }
              schema:
                $ref: '#/components/schemas/ErrorMountNotFound'
        '500':
          description: Internal server error while deleting a mount.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

  /resolver/mounts/{baseUri}/{pid}:
    get:
      summary: Resolve a resource using a mounted base URI and PID.
      operationId: resolveResourceByMountAndPID
      description: |
        Resolves the given base URI to a namespace mount, then resolves the PID within that namespace.

        The `baseUri` path parameter must be a single path segment containing a percent-encoded absolute URI
        (for example, encode `https://example.com/prefix/` as `https%3A%2F%2Fexample.com%2Fprefix%2F`).

        On success, this endpoint returns HTTP 302 with a `Location` header pointing to
        `/resolver/namespaces/{namespace}/resources/{pid}`.

        In anonymous mode, this route is accessible without authentication and without authorization checks.

        In authenticated mode, it applies the same resource visibility rules as
        `GET /resolver/namespaces/{namespace}/resources/{pid}`:

        - Non-deleted resources resolve for any caller, authenticated or not.
        - Deleted resources also resolve for callers who can only see the redacted/censored form.
        - Deleted resources require valid credentials if credentials are supplied, and may return `401`
          when the supplied credentials are invalid.

        If the mount, namespace, or resource does not exist, a 404 response is returned.
      tags:
        - mounts
        - resources
      parameters:
        - name: baseUri
          in: path
          required: true
          description: |
            Absolute base URI of the mount used to resolve the resource, percent-encoded as a single path segment.
          schema:
            $ref: '#/components/schemas/baseUri'
        - name: pid
          in: path
          required: true
          description: |
            Persistent identifier of the resource to resolve within the mounted namespace.
          schema:
            $ref: '#/components/schemas/PID'
      responses:
        '302':
          description: Resource resolved successfully.
          headers:
            Location:
              description: Relative resolver path for the resolved namespace resource.
              schema:
                type: string
          content:
            application/json:
              example: { pid: "abc-def", url: "https://example.org/resource", metadata: "sample metadata", dateCreated: "2026-07-30T10:00:00Z", dateUpdated: "2026-07-30T10:00:00Z", tags: [ "sample" ], deleted: false }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResourceResponse'
                  - $ref: '#/components/schemas/RedactedResourceResponse'
        '400':
          description: Invalid base URI or PID when resolving a mounted resource.
          content:
            application/json:
              example: { error: "invalidBaseUri" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorInvalidBaseUri'
                  - $ref: '#/components/schemas/ErrorInvalidPID'
        '401':
          description: Authentication is required or the supplied credentials are incorrect.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '404':
          description: Mount, namespace, or resource does not exist.
          content:
            application/json:
              example: { error: "mountNotFound" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorMountNotFound'
                  - $ref: '#/components/schemas/ErrorNamespaceNotFound'
                  - $ref: '#/components/schemas/ErrorResourceNotFound'
        '500':
          description: Internal server error while resolving a resource via mount and PID.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

  /resolver/namespaces/{namespace}:
    get:
      summary: Retrieve a single namespace by id.
      operationId: getNamespace
      description: |
        This endpoint returns a single namespace by id.

        In anonymous mode, this route is accessible without authentication.

        In authenticated mode, API-key authentication is required.
        Only namespaces the current user has access to can be accessed.
        This is defined by having a role that is not "none" for a namespace.
        If the authenticated user is a superuser, all namespaces can be accessed.

        If the namespace exists but the caller lacks required access, a 403 response is returned.
        If the namespace does not exist, a 404 response is returned.
      tags:
        - namespaces
      parameters:
        - name: namespace
          in: path
          required: true
          description: |
            Server-assigned namespace id of the namespace to retrieve.
          schema:
            $ref: '#/components/schemas/NamespaceId'
      responses:
        '200':
          description: Namespace found.
          content:
            application/json:
              example: { id: "ns_123", tag: "project-a", pidFormat: { pattern: "***-***", characters: "readable" }, dateCreated: "2026-07-30T10:00:00Z" }
              schema:
                $ref: '#/components/schemas/Namespace'
        '400':
          description: Invalid namespace id when retrieving a namespace.
          content:
            application/json:
              example: { error: "invalidNamespaceId" }
              schema:
                $ref: '#/components/schemas/ErrorInvalidNamespaceID'
        '401':
          description: Authentication is required or the credentials are incorrect when retrieving a namespace.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The namespace exists but the authenticated user is not allowed to access it.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Namespace does not exist when retrieving by id.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                $ref: '#/components/schemas/ErrorNamespaceNotFound'
        '500':
          description: Internal server error while retrieving a namespace.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

  /resolver/namespaces/{namespace}/mounts:
    get:
      summary: List mounts for a namespace.
      operationId: listNamespaceMounts
      description: |
        Returns a paginated list of base URIs mounted to the given namespace.
        Results are ordered ascending by base URI.

        In anonymous mode, this route is accessible without authentication.
        In authenticated mode, the caller must have at least the contributor role for the namespace, or be a superuser.
      tags:
        - mounts
      parameters:
        - name: namespace
          in: path
          required: true
          description: |
            Server-assigned namespace id whose mounts should be listed.
          schema:
            $ref: '#/components/schemas/NamespaceId'
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of base URIs to return for the namespace.
            If omitted, a default value is applied.
            If the value exceeds the configured maximum, it is clamped to that maximum.
            A value of 0 returns an empty items array with a valid total.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: |
            Number of base URIs to skip before starting to collect the result set for the namespace.
            If omitted, the value is treated as 0.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: |
            A paginated list of base URIs, sorted in increasing order.
          content:
            application/json:
              example: { total: 1, offset: 0, items: [ "https://example.org/base/" ] }
              schema:
                $ref: '#/components/schemas/PaginatedBaseUriResponse'
        '400':
          description: Invalid namespace id or query parameter when listing mounts for a namespace.
          content:
            application/json:
              example: { error: "invalidNamespaceId" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorInvalidNamespaceID'
                  - $ref: '#/components/schemas/ErrorInvalidQueryParameter'
        '401':
          description: Authentication is required or the credentials are incorrect when listing mounts for a namespace.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The authenticated user is not allowed to list mounts for this namespace.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Namespace does not exist when listing its mounts.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                $ref: '#/components/schemas/ErrorNamespaceNotFound'
        '500':
          description: Internal server error while listing mounts for a namespace.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

  /resolver/namespaces/{namespace}/roles:
    get:
      summary: List explicit namespace roles.
      operationId: listNamespaceRoles
      description: |
        Lists users who have an explicit non-none role in the namespace.
        Users without an explicit role record have the default `none` role and are not listed.

        In anonymous mode, the route returns a http 404. 
        In authenticated mode, this requires the calling user to have the manager role for the namespace, or be a superuser.
      tags:
        - roles
      parameters:
        - name: namespace
          in: path
          required: true
          description: |
            Server-assigned namespace id whose roles should be listed.
          schema:
            $ref: '#/components/schemas/NamespaceId'
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of roles to return for the namespace.
            If omitted, a default value is applied.
            If the value exceeds the configured maximum, it is clamped to that maximum.
            A value of 0 returns an empty items array with a valid total.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: |
            Number of roles to skip before starting to collect the result set for the namespace.
            If omitted, the value is treated as 0.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Roles listed successfully.
          content:
            application/json:
              example: { total: 1, offset: 0, items: [ { username: "alice", role: "manager" } ] }
              schema:
                $ref: '#/components/schemas/PaginatedNamespaceRolesResponse'
        '400':
          description: Invalid namespace id or query parameter when listing namespace roles.
          content:
            application/json:
              example: { error: "invalidNamespaceId" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorInvalidNamespaceID'
                  - $ref: '#/components/schemas/ErrorInvalidQueryParameter'
        '401':
          description: Authentication is required or the credentials are incorrect when listing namespace roles.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The authenticated user is not allowed to list roles.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Namespace does not exist when listing roles, or the server is in anonymous mode.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNamespaceNotFound'
                  - $ref: '#/components/schemas/ErrorUnavailableInAnonymousMode'
        '500':
          description: Internal server error while listing namespace roles.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

  /resolver/namespaces/{namespace}/roles/{username}:
    get:
      summary: Get a user's role in a namespace.
      operationId: getNamespaceRole
      description: |
        Retrieves the role of a specific user in a namespace.
        If no explicit role record exists, the response returns `role: none`.

        In anonymous mode, the route returns HTTP 404.
        In authenticated mode, callers may read their own role; reading another user's role requires the manager role or being a superuser.
      tags:
        - roles
      parameters:
        - name: namespace
          in: path
          required: true
          description: |
            Server-assigned namespace id in which to look up the user's role.
          schema:
            $ref: '#/components/schemas/NamespaceId'
        - name: username
          in: path
          required: true
          description: |
            Username whose role in the namespace should be retrieved.
          schema:
            $ref: '#/components/schemas/Username'
      responses:
        '200':
          description: Role retrieved successfully.
          content:
            application/json:
              example: { username: "alice", role: "manager" }
              schema:
                $ref: '#/components/schemas/NamespaceRole'
        '400':
          description: Invalid namespace id when retrieving a namespace role.
          content:
            application/json:
              example: { error: "invalidNamespaceId" }
              schema:
                $ref: '#/components/schemas/ErrorInvalidNamespaceID'
        '401':
          description: Authentication is required or the credentials are incorrect when retrieving a namespace role.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The authenticated user is not allowed to view this role.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Namespace or user do not exist, or the server is in anonymous mode.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNamespaceNotFound'
                  - $ref: '#/components/schemas/ErrorUserNotFound'
                  - $ref: '#/components/schemas/ErrorUnavailableInAnonymousMode'
        '500':
          description: Internal server error while retrieving a namespace role.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

    put:
      summary: Set a user's role in a namespace.
      operationId: setNamespaceRole
      description: |
        Sets the role of a specific user in a namespace.
        The `none` role cannot be set via this endpoint; use DELETE to remove an explicit role.

        In anonymous mode, the route returns HTTP 404.
        In authenticated mode, the caller must have the manager role for the namespace, or be a superuser.
        Only superusers can set their own role.
      tags:
        - roles
      parameters:
        - name: namespace
          in: path
          required: true
          description: The ID of the namespace in which a role is to be set.
          schema:
            $ref: '#/components/schemas/NamespaceId'
        - name: username
          description: The name of the user for which a role is to be set.
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Username'
      requestBody:
        description: The role to assign for the user.
        required: true
        content:
          application/json:
            example: { role: "editor" }
            schema:
              $ref: '#/components/schemas/SetNamespaceRoleRequest'
      responses:
        '200':
          description: Role updated successfully.
          content:
            application/json:
              example: { username: "alice", role: "manager" }
              schema:
                $ref: '#/components/schemas/NamespaceRole'
        '400':
          description: Invalid request.
          content:
            application/json:
              example: { error: "bodyMissing" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBodyMissing'
                  - $ref: '#/components/schemas/ErrorBodyInvalidJSON'
                  - $ref: '#/components/schemas/ErrorInvalidNamespaceID'
                  - $ref: '#/components/schemas/ErrorInvalidUsername'
                  - $ref: '#/components/schemas/ErrorInvalidRole'
        '401':
          description: Authentication is required or the credentials are incorrect when setting a namespace role.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The authenticated user is not allowed to set the specified role.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Namespace does not exist when setting a role, or the server is in anonymous mode.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNamespaceNotFound'
                  - $ref: '#/components/schemas/ErrorUserNotFound'
                  - $ref: '#/components/schemas/ErrorUnavailableInAnonymousMode'
        '413':
          description: Request body for setting a namespace role exceeds the configured maximum size.
          content:
            application/json:
              example: { error: "bodySizeExceeded" }
              schema:
                $ref: '#/components/schemas/ErrorBodySizeExceeded'
        '500':
          description: Internal server error while setting a namespace role.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

    delete:
      summary: Remove a user's explicit role in a namespace.
      operationId: removeNamespaceRole
      description: |
        Removes an explicit role record, reverting the user to the default `none` role.

        In anonymous mode, the route returns HTTP 404.
        In authenticated mode, the caller must have the manager role for the namespace, or be a superuser.
        Only superusers can remove themselves from a namespace.
      tags:
        - roles
      parameters:
        - name: namespace
          in: path
          description: The ID of the namespace in which a role is to be deleted.
          required: true
          schema:
            $ref: '#/components/schemas/NamespaceId'
        - name: username
          in: path
          description: The name of the user for whom a role is to be deleted.
          required: true
          schema:
            $ref: '#/components/schemas/Username'
      responses:
        '204':
          description: Role removed successfully.
        '400':
          description: Invalid namespace id or username.
          content:
            application/json:
              example: { error: "invalidNamespaceId" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorInvalidNamespaceID'
                  - $ref: '#/components/schemas/ErrorInvalidUsername'
        '401':
          description: Authentication is required or the credentials are incorrect when removing a namespace role.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The authenticated user is not allowed to delete roles.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Namespace or explicit role not found, or the server is in anonymous mode.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNamespaceNotFound'
                  - $ref: '#/components/schemas/ErrorUserNotFound'
                  - $ref: '#/components/schemas/ErrorRoleNotFound'
                  - $ref: '#/components/schemas/ErrorUnavailableInAnonymousMode'
        '500':
          description: Internal server error while removing a namespace role.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

  /resolver/namespaces/{namespace}/resources:
    get:
      summary: List resources within a namespace.
      operationId: listResources
      description: |
        Returns a paginated list of resources within the namespace, ordered by pid in increasing order.

        In anonymous mode, this route is accessible without authentication and without authorization checks.

        In authenticated mode, the caller must have the editor or manager role for the namespace, or be a superuser.
        If the namespace exists but the caller lacks required access, a 403 response is returned.
        If the namespace does not exist, a 404 response is returned.

        Deleted resources are included according to the `deleted` query filter.
      tags:
        - resources

      parameters:
        - name: namespace
          in: path
          required: true
          description: |
            Server-assigned namespace id whose resources should be listed.
          schema:
            $ref: '#/components/schemas/NamespaceId'
        - name: tag
          description: |
            Filter resources to those that include the given tag among their tags.
            If omitted, resources of all tags are included.
            If provided with an empty value, the value is treated as the empty string.
          in: query
          required: false
          schema:
            type: string
          allowEmptyValue: true
        - name: deleted
          description: |
            Filter resources by their deletion status.
            If true, return only deleted resources.
            If false, return only non-deleted resources.
            If omitted, resources of both deletion states are included.
            Invalid values return a 400 response.
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of resources to return.
            If omitted, a default value is applied.
            If the value exceeds the configured maximum, it is clamped to that maximum.
            A value of 0 returns an empty items array with a valid total.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: |
            Number of resources to skip before starting to collect the result set.
            If omitted, the value is treated as 0.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0

      responses:
        '200':
          description: A paginated list of resources within the namespace, ordered by their pid in increasing order.
          content:
            application/json:
              example: { total: 1, offset: 0, items: [ { pid: "abc-def", url: "https://example.org/resource", metadata: "sample metadata", dateCreated: "2026-07-30T10:00:00Z", dateUpdated: "2026-07-30T10:00:00Z", tags: [ "sample" ], deleted: false } ] }
              schema:
                $ref: '#/components/schemas/PaginatedResourcesResponse'
        '400':
          description: Invalid namespace id or query parameter when listing resources.
          content:
            application/json:
              example: { error: "invalidNamespaceId" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorInvalidNamespaceID'
                  - $ref: '#/components/schemas/ErrorInvalidQueryParameter'
        '401':
          description: Authentication is required or the credentials are incorrect when listing resources.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The namespace exists but the authenticated user is not allowed to list resources.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Namespace does not exist when listing resources.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                $ref: '#/components/schemas/ErrorNamespaceNotFound'
        '500':
          description: Internal server error while listing resources.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

    post:
      summary: Create a resource within a namespace.
      operationId: createResource
      description: |
        Creates a new resource within the namespace.
        A new PID is generated, unique within the namespace, and returned with the response.

        In anonymous mode, this route is accessible without authentication and without authorization checks.

        In authenticated mode, the caller must have the contributor, editor, or manager role for the namespace, or be a superuser.
        If the namespace exists but the caller lacks required access, a 403 response is returned.
        If the namespace does not exist, a 404 response is returned.
      tags:
        - resources

      parameters:
        - name: namespace
          in: path
          required: true
          description: |
            Server-assigned namespace id in which to create the resource.
          schema:
            $ref: '#/components/schemas/NamespaceId'
      requestBody:
        description: The contents of the resource to create.
        required: true
        content:
          application/json:
            example: { url: "https://example.org/resource", metadata: "sample metadata", tags: [ "sample" ] }
            schema:
              $ref: '#/components/schemas/ResourceCreateRequest'

      responses:
        '201':
          description: Resource created successfully.
          content:
            application/json:
              example: { pid: "abc-def", url: "https://example.org/resource", metadata: "sample metadata", dateCreated: "2026-07-30T10:00:00Z", dateUpdated: "2026-07-30T10:00:00Z", tags: [ "sample" ], deleted: false }
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          description: Invalid request body, JSON, or namespace id when creating a resource.
          content:
            application/json:
              example: { error: "bodyMissing" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBodyMissing'
                  - $ref: '#/components/schemas/ErrorBodyInvalidJSON'
                  - $ref: '#/components/schemas/ErrorInvalidNamespaceID'
        '401':
          description: Authentication is required or the credentials are incorrect when creating a resource.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The namespace exists but the authenticated user is not allowed to create a single resource.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '413':
          description: Request body for creating a resource exceeds the configured maximum size.
          content:
            application/json:
              example: { error: "bodySizeExceeded" }
              schema:
                $ref: '#/components/schemas/ErrorBodySizeExceeded'
        '404':
          description: Namespace does not exist when creating a resource.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                $ref: '#/components/schemas/ErrorNamespaceNotFound'
        '500':
          description: Internal server error or PID generation failure while creating a resource.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorDatabaseError'
                  - $ref: '#/components/schemas/ErrorBadIDGeneration'
        '503':
          description: Could not allocate a PID after repeated attempts.
          content:
            application/json:
              example: { error: "insufficientEntropy" }
              schema:
                $ref: '#/components/schemas/ErrorInsufficientEntropy'

  /resolver/namespaces/{namespace}/resources/batch:
    post:
      summary: Create several resources within a namespace.
      operationId: createResourceBatch
      description: |
        Creates multiple resources in a single request.
        This is equivalent to calling the createResource operation repeatedly.

        An empty request body `[]` returns 201 with an empty array.
        The operation is all-or-nothing: if any item fails to be created, none are created and no partial persistence occurs.

        In anonymous mode, this route is accessible without authentication and without authorization checks.

        In authenticated mode, the caller must have the contributor, editor, or manager role for the namespace, or be a superuser.
        If the namespace exists but the caller lacks required access, a 403 response is returned.
        If the namespace does not exist, a 404 response is returned.
      tags:
        - resources

      parameters:
        - name: namespace
          in: path
          required: true
          description: |
            Server-assigned namespace id in which to create the batch of resources.
          schema:
            $ref: '#/components/schemas/NamespaceId'
      requestBody:
        required: true
        description: |
          A list of resources to create.
          Limits on the maximum number of resources and maximum body size are enforced.
          If the maximum number of resources is exceeded, a 422 response is returned.
          If the maximum body size is exceeded, a 413 response is returned.
        content:
          application/json:
            example: [{ url: "https://example.org/resource", metadata: "sample metadata", tags: [ "sample" ] }]
            schema:
              type: array

              items:
                $ref: '#/components/schemas/ResourceCreateRequest'

      responses:
        '201':
          description: Resources created successfully.
          content:
            application/json:
              example: [{ pid: "abc-def", url: "https://example.org/resource", metadata: "sample metadata", dateCreated: "2026-07-30T10:00:00Z", dateUpdated: "2026-07-30T10:00:00Z", tags: [ "sample" ], deleted: false }]
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceResponse'
        '400':
          description: Invalid request body, JSON, or namespace id when creating a resource batch.
          content:
            application/json:
              example: { error: "bodyMissing" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBodyMissing'
                  - $ref: '#/components/schemas/ErrorBodyInvalidJSON'
                  - $ref: '#/components/schemas/ErrorInvalidNamespaceID'
        '401':
          description: Authentication is required or the credentials are incorrect when creating a resource batch.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The namespace exists but the authenticated user is not allowed to create a resource batch.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '413':
          description: Request body for creating a resource batch exceeds the configured maximum size.
          content:
            application/json:
              example: { error: "bodySizeExceeded" }
              schema:
                $ref: '#/components/schemas/ErrorBodySizeExceeded'
        '404':
          description: Namespace does not exist when creating a resource batch.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                $ref: '#/components/schemas/ErrorNamespaceNotFound'
        '422':
          description: Number of items in the batch exceeds the configured maximum.
          content:
            application/json:
              example: {
                error: "itemLimitExceeded"
              }
              schema:
                $ref: '#/components/schemas/ErrorItemLimitExceeded'
        '500':
          description: Internal server error or PID generation failure while creating a resource batch.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorDatabaseError'
                  - $ref: '#/components/schemas/ErrorBadIDGeneration'
        '503':
          description: Could not allocate PIDs after repeated attempts.
          content:
            application/json:
              example: { error: "insufficientEntropy" }
              schema:
                $ref: '#/components/schemas/ErrorInsufficientEntropy'

  /resolver/namespaces/{namespace}/resources/{pid}:
    get:
      summary: Retrieve a resource by PID within a namespace.
      operationId: getResource
      description: |
        Retrieves a single resource by PID within a namespace.

        In anonymous mode, this route is accessible without authentication and without authorization checks.

        In authenticated mode, non-deleted resources may be read by any user, authenticated or not.
        Users without the `contributor` role (or being unauthenticated entirely) cannot read non-deleted resources.

        Deleted resources require authentication and at least the `editor` role for the namespace, or superuser privileges.
        Such callers receive the full resource object with `deleted: true`.
        Unauthorized callers receive 410 Gone with a redacted resource object (`pid`, dates, and `deleted: true` only).

        If the namespace or resource does not exist, a 404 response is returned.
      tags:
        - resources

      parameters:
        - name: namespace
          in: path
          required: true
          description: |
            Server-assigned namespace id containing the resource to retrieve.
          schema:
            $ref: '#/components/schemas/NamespaceId'
        - name: pid
          in: path
          description: The pid of the resource to retrieve.
          required: true
          schema:
            $ref: '#/components/schemas/PID'

      responses:
        '200':
          description: |
            Resource retrieved successfully.
            For deleted resources, the full object is returned only to authenticated callers with at least the `editor` role or superuser privileges.
          content:
            application/json:
              example: { pid: "abc-def", url: "https://example.org/resource", metadata: "sample metadata", dateCreated: "2026-07-30T10:00:00Z", dateUpdated: "2026-07-30T10:00:00Z", tags: [ "sample" ], deleted: false }
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          description: Invalid namespace id or PID in the path.
          content:
            application/json:
              example: { error: "invalidNamespaceId" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorInvalidNamespaceID'
                  - $ref: '#/components/schemas/ErrorInvalidPID'
        '401':
          description: Authentication is required or the credentials are incorrect when retrieving a resource.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '404':
          description: Namespace or resource does not exist when retrieving by PID.
          content:
            application/json:
              example: { error: "namespaceNotFound" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNamespaceNotFound'
                  - $ref: '#/components/schemas/ErrorResourceNotFound'
        '410':
          description: |
            The resource exists but has been deleted.
            Returned to callers who are not allowed to see the full deleted resource, with a redacted object only.
          content:
            application/json:
              example: { pid: "abc-def", dateCreated: "2026-07-30T10:00:00Z", dateUpdated: "2026-07-30T10:00:00Z", deleted: true }
              schema:
                $ref: '#/components/schemas/RedactedResourceResponse'
        '500':
          description: Internal server error while retrieving a resource.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

    patch:
      summary: Update a resource by PID within a namespace.
      operationId: updateResource
      description: |
        Updates a resource using patch semantics.
        Omitted fields are not changed.
        Deleted resources may be modified.
        Setting `deleted` to `false` un-deletes the resource.

        In anonymous mode, this route is accessible without authentication and without authorization checks.

        In authenticated mode, the caller must have the editor or manager role for the namespace, or be a superuser.
        If the namespace or resource exists but the caller lacks required access, a 403 response is returned.
        If the namespace or resource does not exist, a 404 response is returned.
      tags:
        - resources

      parameters:
        - name: namespace
          in: path
          required: true
          description: |
            Server-assigned namespace id containing the resource to update.
          schema:
            $ref: '#/components/schemas/NamespaceId'
        - name: pid
          in: path
          description: The pid of the resource to update.
          required: true
          schema:
            $ref: '#/components/schemas/PID'
      requestBody:
        description: |
          The new contents of the resource to update.
          The resource update request uses patch semantics: if a field is omitted, it is not changed.
          Regardless of the presence or absence of a field, all fields will always be returned in the response.

          Note that empty updates are permitted, and will simply return the current resource contents as is (provided they exist).

          If the configured maximum request body size is exceeded, a 413 response is returned.
        required: true
        content:
          application/json:
            example: { url: "https://example.org/resource", metadata: "sample metadata", deleted: false, tags: [ "sample" ] }
            schema:
              $ref: '#/components/schemas/ResourceUpdateRequest'
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
