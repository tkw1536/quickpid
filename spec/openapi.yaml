  /users:
    get:
      summary: List all user accounts.
      operationId: listUsers
      description: |
        Returns a paginated list of user accounts.

        The `superuser` query parameter may be used to filter results by superuser status.
        When not set, users of all superuser states are included.

        The `password` query parameter may be used to filter results by password status.
        When not set, users of all password states are included.

        In anonymous mode, the route returns HTTP 404.
        In authenticated mode, this route requires superuser privileges.
      tags:
        - user
      parameters:
        - name: superuser
          in: query
          required: false
          description: |
            Filter users by superuser status.
            When true, only superusers are returned.
            When false, only non-superusers are returned.
            When not set, users of all superuser states are included.
            Invalid values return a 400 response.
          schema:
            type: boolean
        - name: password
          in: query
          required: false
          description: |
            Filter users by whether an HTTP basic password is configured.
            When true, only users with a password are returned.
            When false, only users without a password are returned.
            When not set, users of all password states are included.
            Invalid values return a 400 response.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of users to return.
            If omitted, a default value is applied.
            If the value exceeds the configured maximum, it is clamped to that maximum.
            A value of 0 returns an empty items array with a valid total.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: |
            Number of users to skip before starting to collect the result set.
            If omitted, the value is treated as 0.
            Negative values or non-integers return a 400 response.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: |
            A paginated list of users, sorted by username in increasing order.
          content:
            application/json:
              example: { total: 1, offset: 0, items: [ { username: "alice", superuser: false, password: true } ] }
              schema:
                $ref: '#/components/schemas/PaginatedUsersResponse'
        '400':
          description: Invalid query parameter (e.g. limit, offset, superuser, or password).
          content:
            application/json:
              example: { error: "invalidQueryParameter" }
              schema:
                $ref: '#/components/schemas/ErrorInvalidQueryParameter'
        '401':
          description: Authentication is required, the credentials are incorrect, or the authenticated user does not exist.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: The authenticated user is not allowed to list user accounts.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Listing users is unavailable because the server is in anonymous mode.
          content:
            application/json:
              example: {
                error: "unavailableInAnonymousMode"
              }
              schema:
                $ref: '#/components/schemas/ErrorUnavailableInAnonymousMode'
        '500':
          description: Internal server error while listing users.
          content:
            application/json:
              example: { error: "databaseError" }
              schema:
                $ref: '#/components/schemas/ErrorDatabaseError'

