            example: { password: "secret-password" }
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '200':
          description: Password updated successfully.
          content:
            application/json:
              example: { password: true }
              schema:
                $ref: '#/components/schemas/SetPasswordResponse'
        '400':
          description: Invalid request body, username, or password.
          content:
            application/json:
              example: { error: "body_missing" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBodyMissing'
                  - $ref: '#/components/schemas/ErrorBodyInvalidJSON'
                  - $ref: '#/components/schemas/ErrorInvalidUsername'
                  - $ref: '#/components/schemas/ErrorInvalidPassword'
        '401':
          description: Authentication is required or the credentials are incorrect.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Only superusers may set the `username` parameter for another user or it is forbidden to clear your own password.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: The server is in anonymous mode, or the requested user does not exist.
          content:
            application/json:
              example: {}
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorUnavailableInAnonymousMode'
                  - $ref: '#/components/schemas/ErrorUserNotFound'
        '413':
          description: Request body exceeds the configured maximum size.
          content:
            application/json:
              example: { error: "body_size_exceeded" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBodySizeExceeded'
        '500':
          description: Internal server error.
          content:
            application/json:
              example: { error: "database_error" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorDatabaseError'

  /user/key/revoke:
    post:
      summary: Revoke an API key for a user account.
      operationId: revokeUserKey
      description: |
        Revokes an API key.
        This operation is idempotent: revoking an already-revoked key returns 204.

        When not set, the currently authenticated user's keys are targeted.
        The `username` parameter may be used by superusers to revoke a key for another user account, including their own.

        In anonymous mode, the route returns HTTP 404.
      tags:
        - credentials
      parameters:
        - name: username
          in: query
          required: false
          description: |
            When not set, the currently authenticated user's keys are targeted.
            Superusers may set this parameter to revoke a key for another user account, including their own.
          schema:
            $ref: '#/components/schemas/Username'
      requestBody:
        required: true
        description: |
          Identifies the API key to revoke.
          If the configured maximum request body size is exceeded, a 413 response is returned.
        content:
          application/json:
            example: { id: "key_123" }
            schema:
              $ref: '#/components/schemas/RevokeKeyRequest'
      responses:
        '204':
          description: API key revoked successfully, including when the key was already revoked.
        '400':
          description: Invalid request body or query parameter.
          content:
            application/json:
              example: { error: "body_missing" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBodyMissing'
                  - $ref: '#/components/schemas/ErrorBodyInvalidJSON'
                  - $ref: '#/components/schemas/ErrorInvalidUsername'
                  - $ref: '#/components/schemas/ErrorInvalidQueryParameter'
        '401':
          description: Authentication is required or the credentials are incorrect.
          content:
            application/json:
              example: { error: "unauthorized" }
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Only superusers may set the `username` parameter.
          content:
            application/json:
              example: { error: "forbidden" }
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: The API key does not exist, does not belong to the requested user, the requested user does not exist, or the server is in anonymous mode.
          content:
            application/json:
              example: { error: "key_not_found" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorKeyNotFound'
                  - $ref: '#/components/schemas/ErrorUserNotFound'
                  - $ref: '#/components/schemas/ErrorUnavailableInAnonymousMode'
        '413':
          description: Request body exceeds the configured maximum size.
          content:
            application/json:
              example: { error: "body_size_exceeded" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBodySizeExceeded'
        '500':
          description: Internal server error.
          content:
            application/json:
              example: { error: "database_error" }
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorDatabaseError'

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        API key passed as a bearer token in the Authorization header.
        Required in authenticated mode unless the operation description states otherwise.
    basicAuth:
      type: http
      scheme: basic
      description: |
        Username and password passed via HTTP Basic authentication.
        Required in authenticated mode unless the operation description states otherwise.
        If both bearer and basic credentials are sent, the request is unauthorized.

  schemas:
    ErrorResponse:
      example: { error: "unauthorized" }
      description: |
        An error response.
        Specific routes return specific error responses.
      type: object
      required:
        - error
      properties:
        error:
          example: "unauthorized"
          type: string
          description: |
            Machine-readable error code identifying the failure.
            The precise string values are defined by this specification for each request.

    ErrorDatabaseError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - database_error
          description: |
            An unspecified internal problem occurred while interacting with the database.
            This may be due to the database being offline, or due to data corruption. 
    ErrorBadIDGeneration:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - bad_id_generation
          description: |
            The resolver attempted to generate a namespace id or PID, but this resulted in an invalid value.
            This is different from being unable to generate a value due to insufficient entropy.
    ErrorInsufficientEntropy:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - insufficient_entropy
          description: |
            The resolver attempted to generate a namespace id or PID, but this resulted only in duplicate ids after repeated attempts.
            This is caused either by insufficient entropy available to the ID generator, or the set of available Namespace IDs or PIDs being exhausted. 
    ErrorBodyMissing:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - body_missing
          description: The request body was required but missing.
    ErrorBodySizeExceeded:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - body_size_exceeded
          description: The request body exceeded the configured maximum size.
    ErrorBodyInvalidJSON:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - body_invalid_json
          description: The request body was not valid JSON, did not match the expected shape, or contained unknown fields.
    ErrorInvalidQueryParameter:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - invalid_query_parameter
          description: A query parameter was invalid.
    ErrorItemLimitExceeded:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - item_limit_exceeded
          description: The number of items in a single request exceeded the limit.
    ErrorInvalidNamespaceID:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - invalid_namespace_id
          description: The namespace id was invalid.
    ErrorInvalidPID:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - invalid_pid
          description: The PID was invalid.
    ErrorInvalidUsername:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - invalid_username
          description: The username was invalid.
    ErrorInvalidPassword:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - invalid_password
          description: The password was invalid.
    ErrorInvalidBaseURI:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - invalid_base_uri
          description: The base URI was invalid.
    ErrorNamespaceNotFound:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - namespace_not_found
          description: The namespace does not exist.
    ErrorResourceNotFound:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - resource_not_found
          description: The resource does not exist.
    ErrorMountNotFound:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - mount_not_found
          description: The mount does not exist.
    ErrorInfoUnavailable:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - info_unavailable
          description: |
            Resolver configuration info is unavailable.
            The resolver may choose to hide this information for security reasons.
    ErrorUnavailableInAnonymousMode:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - unavailable_in_anonymous_mode
          description: This route is not available while the server is in anonymous mode.
    ErrorUnauthorized:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - unauthorized
          description: Authentication is required or the credentials are incorrect.
    ErrorForbidden:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - forbidden
          description: The authenticated user is not allowed to perform this action.
    InfoResponse:
      description:
        Public resolver limits and configuration.
        A zero value indicates that no limit is enforced.
      type: object
      required:
        - max_body_bytes
        - default_page_limit
        - max_page_limit
        - max_batch_items
      properties:
        max_body_bytes:
          example: 1048576
          description: |
            Maximum permitted size of the request body in bytes.
          type: integer
          format: int64
          minimum: 0
        default_page_limit:
          example: 10
          description: |
            Default number of items per page.
          type: integer
          format: int64
          minimum: 0
        max_page_limit:
          example: 100
          description: |
            Maximum number of items per page in a response.
          type: integer
          format: int64
          minimum: 0
        max_batch_items:
          example: 100
          description: |
            Maximum number of items in a batch.
          type: integer
          format: int64
          minimum: 0
        authentication:
          example: true
          description: |
            If present, parts of the API require authentication via an API key.
            Support for other authentication methods may be added in the future.
          type: boolean
          enum: [true]
        max_autocomplete_users:
          example: 10
          description: |
            Maximum number of usernames returned by GET /users/autocomplete.
            Present only when the server is in authenticated mode.
          type: integer
          format: int64
          minimum: 1
    MetaResponse:
      description: |
        Optional public meta information about the server.
        All fields are optional. When present, each field must be a non-empty string.
      type: object
      additionalProperties: false
      properties:
        about:
          example: "https://quickpid.example/about"
          description: |
            Description of where to find more information about this service.
            Typically a URL, but not necessarily so.
          type: string
          format: uri
          minLength: 1
        comment:
          example: "A PID resolver service"
          description: |
            Human-readable message about this server.
          type: string
          minLength: 1
        software:
          example: "QuickPID"
          description: |
            Name of the software running this server.
          type: string
          minLength: 1
        version:
          example: "1.0.0"
          description: |
            Version of the software running this server.
          type: string
          minLength: 1
    UsernameListResponse:
      description: |
        A list of usernames.
      type: array
      items:
        $ref: '#/components/schemas/Username'
    NamespaceCreateRequest:
      description: |
        Namespace to be created. The server assigns an opaque id.
      type: object
      additionalProperties: false
      required:
        - tag
        - pid_format
      properties:
        tag:
          example: "project-a"
          description: |
            A tag for this namespace. Tags can be used for filtering when listing namespaces.
          type: string
        pid_format:
          $ref: '#/components/schemas/PIDFormat'
    Namespace:
      description: A namespace available on this resolver.
      type: object
      required:
        - id
        - tag
        - pid_format
        - date_created
      properties:
        id:
          example: "bafac567-6170-4df2-8c45-17797eb43c88"
          description: |
            Server-assigned opaque namespace id. Use this value in resource URLs.
          allOf:
            - $ref: '#/components/schemas/NamespaceId'
        tag:
          example: "project-a"
          description: |
            A tag for this namespace. Tags can be used for filtering when listing namespaces.
          type: string
        pid_format:

          $ref: '#/components/schemas/PIDFormat'
        date_created:
          example: "2026-07-30T10:00:00Z"
          description: The date and time the namespace was created.
          type: string
          format: date-time
    PIDFormat:
      description: |
        PID format used for new resources in this namespace.
        PIDs are generated by replacing each `*` in the pattern with a random character from the selected character set.
        The pattern may only contain `*`, `-`, and `_`.
      type: object
      additionalProperties: false
      required:
        - pattern
        - characters
      properties:
        pattern:
          type: string
          pattern: '^[\*_\-]*\*[\*_\-]*$'
          description: |
            Pattern consisting only of `*`, `-`, and `_`.
            `*` positions are replaced with random characters during PID generation.
            At least one '*' is required.
          example: '***-***'
        characters:
          $ref: '#/components/schemas/PIDCharacters'
    PIDCharacters:
      description: Character set used to replace `*` in the PID pattern.
      type: string
      enum:
        - full
        - readable
        - hex
        - decimal
      x-enumDescriptions:
        full: Lowercase alphanumeric (`0-9a-z`).
        readable: Lowercase alphanumeric without ambiguous characters (`0-9a-z` excluding i, l, o, u).
        hex: Lowercase hex (`0-9a-f`).
        decimal: Decimal digits (`0-9`).
    NamespaceId:
      example: "bafac567-6170-4df2-8c45-17797eb43c88"
      description: |
        Server-assigned namespace id.
        The server assigns an opaque id, the only guarantee being that it is unique within the resolver.
        Allowed characters are lowercase letters, digits, hyphen, and underscore.
      type: string
      pattern: '^[a-z0-9_-]+$'
    BaseURI:
      example: "https://example.org/base/"
      description: |
        Absolute base URI used as the key of a namespace mount.
        Must be a valid absolute URI (non-empty scheme).
        May not have a query or a fragment component.
        When used as a path parameter, the full URI must be percent-encoded as a single path segment.
      type: string
      format: uri
    Mount:
      description: A unidirectional mapping from a base URI to a namespace id.
      type: object
      additionalProperties: false
      required:
        - base_uri
        - namespace
      properties:
        base_uri:
          $ref: '#/components/schemas/BaseURI'
        namespace:
          $ref: '#/components/schemas/NamespaceId'
    MountUpsertRequest:
      description: Request to create or replace a namespace mount.
      type: object
      additionalProperties: false
      required:
        - namespace
      properties:
        namespace:
          $ref: '#/components/schemas/NamespaceId'
    PaginatedMountsResponse:
      description: |
        A single page of mount responses.
        The 'total' field is the total number of mounts, ignoring 'limit' and 'offset'.
        The 'offset' field is the effective offset used to produce this response.
      type: object
      required:
        - total
        - offset
        - items
      properties:
        total:
          example: 10
          type: integer
          minimum: 0
          description: Total number of items available.
        offset:
          example: 0
          type: integer
          minimum: 0
          description: Offset of the current response.
        items:
          example: []
          type: array
          items:
            $ref: '#/components/schemas/Mount'
    PaginatedBaseURIResponse:
      description: |
        A single page of base URI strings.
        The 'total' field is the total number of URIs, ignoring 'limit' and 'offset'.
        The 'offset' field is the effective offset used to produce this response.
      type: object
      required:
        - total
        - offset
        - items
      properties:
        total:
          example: 1
          type: integer
          minimum: 0
          description: Total number of items available.
        offset:
          example: 0
          type: integer
          minimum: 0
          description: Offset of the current response.
        items:
          example: []
          type: array
          items:
            $ref: '#/components/schemas/BaseURI'
    Username:
      description: |
        Username of a user account.
        These can be chosen by the caller, and must be unique within the resolver.
        It must be non-empty, and may only contain lowercase letters, digits, hyphen, and underscore.
      type: string
      pattern: '^[a-z0-9_-]+$'
    PaginatedNamespacesResponse:
      description: |
        A single page of namespace responses.
        The 'total' field is the total number of namespaces after applying the tag filter (if any), ignoring 'limit' and 'offset'.
        The 'offset' field is the effective offset used to produce this response.
      type: object
      required:
        - total
        - offset
        - items
      properties:
        total:
          type: integer
          minimum: 0
          example: 1
          description: Total number of items available.
        offset:
          type: integer
          minimum: 0
          example: 0
          description: Offset of the current response.
        items:
          example: []
          type: array
          items:
            $ref: '#/components/schemas/Namespace'
    ResourceCountResponse:
      description: |
        Total number of resources (issued PIDs) across all namespaces.
        Includes soft-deleted resources.
      type: object
      required:
        - total
      properties:
        total:
          example: 42
          type: integer
          minimum: 0
          description: Total number of resource rows in the resolver.
    PaginatedResourcesResponse:
      description: |
        A single page of resource responses.
        The 'total' field is the total number of resources available after applying any applicable filters, ignoring 'limit' and 'offset'.
        The 'offset' field is the effective offset used to produce this response.
      type: object
      required:
        - total
        - offset
        - items
      properties:
        total:
          type: integer
          minimum: 0
          example: 1
          description: Total number of items available.
        offset:
          type: integer
          minimum: 0
          example: 0
          description: Offset of the current response.
        items:
          example: []
          type: array
          items:
            $ref: '#/components/schemas/ResourceResponse'
    ResourceCreateRequest:
      description: |
        A request to create a resource.
        The `tags` field is required and may be an empty array.
      type: object
      additionalProperties: false
      required:
        - url
        - metadata
        - tags
      properties:
        url:
          example: "https://example.org/resource"
          description: |
            The URL of this resource.
          type: string
          format: uri
        metadata:
          example: "sample metadata"
          description: |
            Optional opaque metadata associated with the resource.
            This may be null.
          type: string
          nullable: true
        tags:
          example: ["sample"]
          description: |
            Tags for this resource.
            Tags can be used inside the API for filtering.
            May be empty.
          type: array
          items:
            type: string
    PID:
      description: |
        A persistent identifier for a resource.
        The identifier uniquely identifies the resource within the namespace.
        The precise format of the identifier is determined by the PID format of the applicable namespace.
      type: string
      pattern: '^[a-z0-9_-]+$'
      example: 'abc-def'
    ResourceResponse:
      description: |
        A resource stored on this resolver.
        Tags are always returned as a `tags` array, which may be empty.
      type: object
      additionalProperties: false
      required:
        - pid
        - url
        - metadata
        - date_created
        - date_updated
        - tags
        - deleted
      properties:
        pid:
          $ref: '#/components/schemas/PID'
        url:
          example: "https://example.org/resource"
          description: |
            The URL of this resource.
          type: string
          format: uri
        metadata:
          example: "sample metadata"
          description: |
            Optional opaque metadata associated with the resource.
          type: string
          nullable: true
        date_created:
          example: "2026-07-30T10:00:00Z"
          description: |
            The date and time the resource was created.
          type: string
          format: date-time
        date_updated:
          example: "2026-07-30T10:00:00Z"
          description: |
            The date and time the resource was last updated.
          type: string
          format: date-time
        tags:
          example: ["sample"]
          description: |
            Tags for this resource.
            Tags can be used inside the API for filtering.
            May be empty.
          type: array
          items:
            type: string
        deleted:
          example: false
          description: |
            Whether this resource has been deleted.
          type: boolean
    RedactedResourceResponse:
      description: |
        A redacted view of a deleted resource.
        Returned with HTTP 410 when the caller is not allowed to see the full resource.
      type: object
      additionalProperties: false
      required:
        - pid
        - date_created
        - date_updated
        - deleted
      properties:
        pid:
          $ref: '#/components/schemas/PID'
        date_created:
          example: "2026-07-30T10:00:00Z"
          description: |
            The date and time the resource was created.
          type: string
          format: date-time
        date_updated:
          example: "2026-07-30T10:00:00Z"
          description: |
            The date and time the resource was last updated.
          type: string
          format: date-time
        deleted:
          example: true
          description: |
            Always true for redacted deleted resources.
          type: boolean
          enum:
            - true
    ResourceUpdateRequest:
      description: |
        A request to update a resource.
        Fields that are omitted will not be changed.
        When `tags` is present it replaces the resource tags and may be empty.
        Omitting `tags` leaves the resource tags unchanged.
      type: object
      additionalProperties: false
      properties:
        url:
          example: "https://example.org/resource"
          description: |
            The URL of this resource.
          type: string
          format: uri
        metadata:
          example: "sample metadata"
          description: |
            Optional opaque metadata associated with the resource.
            Note that there is a difference between not updating the metadata field, setting it to null, and setting it to the empty string.
          type: string
          nullable: true
        deleted:
          example: false
          type: boolean
        tags:
          example: ["sample"]
          description: |
            Tags for this resource.
            Tags can be used inside the API for filtering.
            May be empty.
          type: array
          items:
            type: string
    ErrorDuplicateUsername:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - duplicate_username
          description: The username is already in use.
    ErrorUserNotFound:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - user_not_found
          description: The user does not exist.
    ErrorKeyNotFound:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - key_not_found
          description: The API key does not exist or does not belong to the current user.
    UserCreateRequest:
      description: A user account to create.
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          example: "alice"
          description: The username for the new account.
          allOf:
            - $ref: '#/components/schemas/Username'
        superuser:
          example: false
          description: |
            Whether the new account should have superuser privileges.
            Only superusers may set this field to true.
          type: boolean
          default: false
    UserCreateResponse:
      description: A newly created user account.
      allOf:
        - $ref: '#/components/schemas/UserInfo'
    UserInfo:
      description: Information about a user account.
      type: object
      required:
        - username
        - superuser
        - password
      properties:
        username:
          example: "alice"
          description: The username of the account.
          allOf:
            - $ref: '#/components/schemas/Username'
        superuser:
          example: false
          description: Whether the account has superuser privileges.
          type: boolean
        password:
          example: true
          description: Whether the account has an HTTP basic password configured.
          type: boolean
    Password:
      description: A non-empty password string.
      type: string
      minLength: 1
    SetPasswordRequest:
      description: Sets or clears a user password.
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          example: "secret-password"
          description: Set to a non-empty string to configure a password, or null to clear it.
          allOf:
            - $ref: '#/components/schemas/Password'
          nullable: true
    SetPasswordResponse:
      description: Whether a password is configured after the update.
      type: object
      required:
        - password
      properties:
        password:
          example: true
          description: Whether the account now has a password configured.
          type: boolean
    UpdateUserRequest:
      description: Fields to update on a user account.
      type: object
      additionalProperties: false
      properties:
        superuser:
          example: false
          description: Whether the account should have superuser privileges.
          type: boolean
    PaginatedUsersResponse:
      description: |
        A single page of user responses.
        The 'total' field is the total number of users after applying the superuser filter (if any), ignoring 'limit' and 'offset'.
        The 'offset' field is the effective offset used to produce this response.
      type: object
      required:
        - total
        - offset
        - items
      properties:
        total:
          type: integer
          minimum: 0
          example: 1
          description: Total number of items available.
        offset:
          type: integer
          minimum: 0
          example: 0
          description: Offset of the current response.
        items:
          example: []
          type: array
          items:
            $ref: '#/components/schemas/UserInfo'
    PaginatedAPIKeysResponse:
      description: |
        A single page of API key responses.
        The 'total' field is the total number of API keys for the selected user after applying any username filter, ignoring 'limit' and 'offset'.
        The 'offset' field is the effective offset used to produce this response.
      type: object
      required:
        - total
        - offset
        - items
      properties:
        total:
          type: integer
          minimum: 0
          example: 1
          description: Total number of items available.
        offset:
          type: integer
          minimum: 0
          example: 0
          description: Offset of the current response.
        items:
          example: []
          type: array
          items:
            $ref: '#/components/schemas/APIKeyInfo'
    IssueKeyRequest:
      description: Metadata for an API key to issue.
      type: object
      additionalProperties: false
      required:
        - comment
        - expires_at
      properties:
        comment:
          example: "CI deploy key"
          description: A human-readable comment describing the purpose of this key.
          type: string
        expires_at:
          example: "2026-07-30T10:00:00Z"
          description: |
            Optional expiration time for the key.
            If null, the key does not expire.
            If set, the value must be in the future; past values return a 400 response.
          type: string
          format: date-time
          nullable: true
    IssueKeyResponse:
      description: |
        A newly issued API key.
        The raw key value is returned only once and cannot be retrieved again.
      allOf:
        - $ref: '#/components/schemas/APIKeyInfo'
        - type: object
          required:
            - key
          properties:
            key:
              description: |
                The raw API key value.
                This value is returned only once at creation time.
              type: string
    RevokeKeyRequest:
      description: Identifies an API key to revoke.
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          example: "key_123"
          description: Server-assigned id of the API key to revoke.
          allOf:
            - $ref: '#/components/schemas/APIKeyId'
    APIKeyId:
      description: Server-assigned API key id.
      type: string
    APIKeyInfo:
      description: Metadata for an API key.
      type: object
      required:
        - id
        - comment
        - created_at
        - expires_at
      properties:
        id:
          example: "key_123"
          description: Server-assigned id of this API key.
          allOf:
            - $ref: '#/components/schemas/APIKeyId'
        comment:
          example: "CI deploy key"
          description: A human-readable comment describing the purpose of this key.
          type: string
        created_at:
          description: The date and time the key was created.
          type: string
          format: date-time
        expires_at:
          description: |
            Optional expiration time for the key.
            If null, the key does not expire.
          type: string
          format: date-time
          nullable: true
    Role:
      description: |
        Role for a user within a namespace.
        The default role is `none`.
        The `none` role cannot be assigned explicitly.
      type: string
      enum:
        - none
        - contributor
        - editor
        - manager
      x-enum-descriptions:
        - Can read any resource by exact namespace and PID; cannot list, create, edit, or manage roles.
        - Can create resources; cannot read resources.
        - Can create, edit, and list all resources in the namespace.
        - Editor privileges plus the ability to manage roles for other users in the namespace.
      example: "editor"
    NamespaceRole:
      description: A user's role within a namespace.
      type: object
      required:
        - username
        - role
      properties:
        username:
          example: "alice"
          description: Username of the user account.
          allOf:
            - $ref: '#/components/schemas/Username'
        role:
          example: "editor"
          description: Role of the user in the namespace.
          allOf:
            - $ref: '#/components/schemas/Role'
    SetNamespaceRoleRequest:
      description: Request to set a user's role in a namespace.
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          example: "manager"
          allOf:
            - $ref: '#/components/schemas/Role'
    PaginatedNamespaceRolesResponse:
      description: Paginated list of namespace roles.
      type: object
      required:
        - total
        - offset
        - items
      properties:
        total:
          example: 10
          type: integer
          minimum: 0
        offset:
          example: 0
          type: integer
          minimum: 0
        items:
          example: []
          type: array
          items:
            $ref: '#/components/schemas/NamespaceRole'
    UserRole:
      description: A role for a user within a specific namespace.
      type: object
      required:
        - namespace
        - role
      properties:
        namespace:
          description: Identifier of the namespace.
          allOf:
            - $ref: '#/components/schemas/NamespaceId'
        role:
          $ref: '#/components/schemas/Role'
    PaginatedUserRolesResponse:
      description: Paginated list of roles for a user across namespaces.
      type: object
      required:
        - total
        - offset
        - items
      properties:
        total:
          type: integer
          example: 1
          minimum: 0
        offset:
          type: integer
          example: 0  
          minimum: 0
        items:
          example: []
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
    ErrorRoleNotFound:
      description: The provided role was not found.
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - role_not_found
          description: No explicit role exists for the user in this namespace.
    ErrorInvalidRole:
      description: The provided role exists, but cannot be used in this context.
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum:
                - invalid_role
          description: The role is not valid or is not assignable via PUT.
